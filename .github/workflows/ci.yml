name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=inspect \
            -p 5433:5432 postgres:17 -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
          # The image's bootstrap server answers pg_isready before the real one
          # is up and the database exists, so wait for an actual query.
          for i in $(seq 1 60); do docker exec pg psql -U postgres -d inspect -Atc 'select 1' >/dev/null 2>&1 && break; sleep 1; done
          docker exec -i pg psql -q -v ON_ERROR_STOP=1 -U postgres -d inspect < testdata/test-schema.sql
      - run: go vet ./...
      - run: go test -count=1 ./...

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build:
    name: Wails build (linux smoke test)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - run: wails build -platform linux/amd64 -tags webkit2_41 -skipbindings
      - run: ls -la build/bin
