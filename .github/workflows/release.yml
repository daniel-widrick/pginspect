name: Release builds

# Builds pginspect for each platform when a GitHub release is published and
# attaches the binaries to it. Can also be run by hand to produce workflow
# artifacts without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.15.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            platform: darwin/universal
            artifact: pginspect-darwin-universal.zip
          - name: Windows amd64
            os: windows-latest
            platform: windows/amd64
            artifact: pginspect-windows-amd64.exe
          - name: Linux amd64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: pginspect-linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: |
          extra=""
          if [ "${{ runner.os }}" = "Linux" ]; then extra="-tags webkit2_41"; fi
          wails build -clean -platform ${{ matrix.platform }} $extra \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --keepParent build/bin/pginspect.app "dist/${{ matrix.artifact }}" ;;
            Windows)
              cp build/bin/pginspect.exe "dist/${{ matrix.artifact }}" ;;
            Linux)
              tar -C build/bin -czf "dist/${{ matrix.artifact }}" pginspect ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.artifact }}" --clobber

  checksums:
    name: Checksums and signature
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Write and sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd dist
          sha256sum pginspect-* > checksums.txt
          cat checksums.txt
          cd ..
          go run ./cmd/relsign dist/checksums.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: checksums
          path: |
            dist/checksums.txt
            dist/checksums.txt.sig
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/checksums.txt dist/checksums.txt.sig --clobber
